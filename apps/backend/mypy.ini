# Mypy config for the GitBunny backend.
# Goal: type-check YOUR code (app/) meaningfully without drowning in errors
# about third-party libraries that ship no type stubs.

[mypy]
python_version = 3.12
plugins = pydantic.mypy

# Check your own code reasonably strictly.
warn_unused_ignores = True
warn_redundant_casts = True
warn_return_any = True
no_implicit_optional = True
check_untyped_defs = True

# Don't fail because asyncpg / redis / jwt / etc. lack type stubs.
# This silences "missing import" noise for libraries you don't control.
ignore_missing_imports = True

# Alembic migrations are auto-generated; not worth type-checking.
[mypy-alembic.*]
ignore_errors = True

# Pydantic plugin settings — makes Settings / BaseModel typing accurate.
[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True